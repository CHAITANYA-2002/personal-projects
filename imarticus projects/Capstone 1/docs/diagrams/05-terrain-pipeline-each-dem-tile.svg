<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 770 320" role="img" aria-label="Terrain pipeline: each DEM tile is masked for voids, converted to slope and ruggedness rasters, sliced into 100 cells, reduced to ten statistics, then thresholded into the hill mask.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker>
<marker id="ar05a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar-acc"/></marker></defs>

<rect x="10" y="16" width="128" height="46" class="n"/><text x="74" y="35" class="t" text-anchor="middle">442 tiles</text><text x="74" y="51" class="t-s" text-anchor="middle">6 parallel workers</text>
<line x1="74" y1="66" x2="74" y2="86" class="e" marker-end="url(#ar05)"/>

<polygon points="74,90 144,120 74,150 4,120" class="n-sunk"/>
<text x="74" y="116" class="t-s" text-anchor="middle">missing tiles</text>
<text x="74" y="130" class="t-s" text-anchor="middle">over 2%?</text>
<text x="158" y="112" class="t-m" style="fill:var(--crit)">yes → exit 1</text>
<text x="158" y="128" class="t-s">"the mask would reflect</text>
<text x="158" y="142" class="t-s">download failures, not terrain"</text>

<line x1="74" y1="154" x2="74" y2="176" class="e" marker-end="url(#ar05)"/>
<text x="84" y="170" class="t-m">no</text>

<rect x="10" y="180" width="128" height="46" class="n"/><text x="74" y="198" class="t" text-anchor="middle">mask voids</text><text x="74" y="214" class="t-s" text-anchor="middle">−32767, −9999, &lt;−500 m</text>
<line x1="142" y1="203" x2="176" y2="203" class="e" marker-end="url(#ar05)"/>

<rect x="180" y="164" width="140" height="36" class="n"/><text x="250" y="187" class="t" text-anchor="middle">slope + aspect</text>
<rect x="180" y="208" width="140" height="36" class="n"/><text x="250" y="231" class="t" text-anchor="middle">ruggedness (TRI)</text>
<text x="250" y="260" class="t-s" text-anchor="middle">spacing_x scaled by cos(lat)</text>
<text x="250" y="275" class="t-s" text-anchor="middle">— 18% error at 35°N if skipped</text>

<line x1="324" y1="203" x2="358" y2="203" class="e" marker-end="url(#ar05)"/>
<rect x="362" y="180" width="128" height="46" class="n"/><text x="426" y="198" class="t" text-anchor="middle">slice 10×10 cells</text><text x="426" y="214" class="t-s" text-anchor="middle">via affine transform</text>

<line x1="426" y1="176" x2="426" y2="150" class="e" marker-end="url(#ar05)"/>
<polygon points="426,146 512,120 426,94 340,120" class="n-sunk"/>
<text x="426" y="116" class="t-s" text-anchor="middle">≥50% pixels</text>
<text x="426" y="130" class="t-s" text-anchor="middle">finite?</text>
<text x="526" y="124" class="t-m" style="fill:var(--crit)">no → drop cell</text>

<line x1="426" y1="90" x2="426" y2="66" class="e" marker-end="url(#ar05)"/>
<rect x="352" y="16" width="148" height="46" class="n"/><text x="426" y="35" class="t" text-anchor="middle">10 statistics</text><text x="426" y="51" class="t-s" text-anchor="middle">elev · slope · aspect · tri</text>

<line x1="504" y1="39" x2="540" y2="39" class="e-acc" marker-end="url(#ar05a)"/>
<polygon points="612,39 700,72 612,105 524,72" class="n-acc" transform="translate(0,-33)"/>
<text x="612" y="34" class="t-s t-acc" text-anchor="middle">slope_mean</text>
<text x="612" y="48" class="t-s t-acc" text-anchor="middle">≥ 5.0°?</text>

<line x1="612" y1="76" x2="612" y2="104" class="e-acc" marker-end="url(#ar05a)"/>
<rect x="528" y="108" width="168" height="46" class="n-acc"/>
<text x="612" y="127" class="t-b t-acc" text-anchor="middle">is_hill = 1</text>
<text x="612" y="143" class="t-s" text-anchor="middle">22,594 of 40,800 cells</text>

<rect x="528" y="176" width="230" height="86" class="n-ghost"/>
<text x="540" y="196" class="t-s" style="fill:var(--crit)">The mask has NO elevation term.</text>
<text x="540" y="214" class="t-s">Ladakh and the Tibetan plateau are</text>
<text x="540" y="230" class="t-s">high, cold, outside the monsoon —</text>
<text x="540" y="246" class="t-s">and comfortably above 5°. They pass.</text>
</svg>