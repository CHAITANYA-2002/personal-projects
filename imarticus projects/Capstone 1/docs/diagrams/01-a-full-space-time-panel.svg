<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 760 210" role="img" aria-label="A full space-time panel of 82 million cell-days is reduced by case-control sampling to 11,955 rows, keeping all 1,719 events and drawing designed controls around them.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<rect x="10" y="30" width="230" height="150" class="n-sunk"/>
<text x="125" y="22" class="t-b" text-anchor="middle">Full space-time panel</text>
<text x="125" y="62" class="t-m" text-anchor="middle">22,594 hill cells</text>
<text x="125" y="80" class="t-m" text-anchor="middle">× 3,653 days</text>
<text x="125" y="112" class="t" text-anchor="middle" style="font-size:19px;font-weight:700">82,535,882</text>
<text x="125" y="130" class="t-s" text-anchor="middle">cell-days</text>
<text x="125" y="158" class="t-s" text-anchor="middle" style="fill:var(--crit)">0.002% positive</text>

<g>
  <line x1="248" y1="105" x2="316" y2="105" class="e-acc" marker-end="url(#ar01)"/>
  <text x="282" y="96" class="t-m t-acc" text-anchor="middle">case-</text>
  <text x="282" y="84" class="t-m t-acc" text-anchor="middle">control</text>
</g>

<rect x="326" y="30" width="200" height="150" class="n-acc"/>
<text x="426" y="22" class="t-b" text-anchor="middle">Sampled frame</text>
<text x="426" y="62" class="t-m" text-anchor="middle">every case kept</text>
<text x="426" y="80" class="t-m" text-anchor="middle">6 designed controls each</text>
<text x="426" y="112" class="t" text-anchor="middle" style="font-size:19px;font-weight:700">11,955</text>
<text x="426" y="130" class="t-s" text-anchor="middle">rows</text>
<text x="426" y="158" class="t-s t-acc" text-anchor="middle">13.8% positive</text>

<line x1="534" y1="105" x2="596" y2="105" class="e" marker-end="url(#ar01)"/>
<text x="565" y="96" class="t-m" text-anchor="middle">score</text>

<rect x="606" y="55" width="144" height="100" class="n-wat"/>
<text x="678" y="47" class="t-b" text-anchor="middle">Prior correction</text>
<text x="678" y="82" class="t-s" text-anchor="middle">shifts the intercept</text>
<text x="678" y="99" class="t-s" text-anchor="middle">back to the</text>
<text x="678" y="116" class="t-s" text-anchor="middle">population scale</text>
<text x="678" y="140" class="t-m t-wat" text-anchor="middle">§12</text>
</svg>