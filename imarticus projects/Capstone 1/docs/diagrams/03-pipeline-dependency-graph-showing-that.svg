<rect x="682" y="26" width="66" height="44" class="n"/><text x="715" y="45" class="t-b" text-anchor="middle">07</text><text x="715" y="60" class="t-s" text-anchor="middle">train</text>
<rect x="682" y="80" width="66" height="44" class="n"/><text x="715" y="99" class="t-b" text-anchor="middle">08</text><text x="715" y="114" class="t-s" text-anchor="middle">score</text>
<rect x="682" y="134" width="66" height="44" class="n-wat"/><text x="715" y="153" class="t-b t-wat" text-anchor="middle">10</text><text x="715" y="168" class="t-s" text-anchor="middle">verify</text>

