<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 790 250" role="img" aria-label="Pipeline dependency graph showing that stages 11 and 09 must precede stage 04, and that stage 05 gates stages 06 through 08.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker>
<marker id="ar03a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar-acc"/></marker></defs>

<rect x="8" y="98" width="72" height="44" class="n"/><text x="44" y="118" class="t-b" text-anchor="middle">00</text><text x="44" y="133" class="t-s" text-anchor="middle">schema</text>
<rect x="102" y="42" width="72" height="44" class="n"/><text x="138" y="62" class="t-b" text-anchor="middle">01</text><text x="138" y="77" class="t-s" text-anchor="middle">catalogue</text>
<rect x="102" y="154" width="72" height="44" class="n"/><text x="138" y="174" class="t-b" text-anchor="middle">02</text><text x="138" y="189" class="t-s" text-anchor="middle">DEM</text>
<rect x="196" y="154" width="72" height="44" class="n"/><text x="232" y="174" class="t-b" text-anchor="middle">03</text><text x="232" y="189" class="t-s" text-anchor="middle">terrain</text>
<rect x="290" y="196" width="72" height="42" class="n"/><text x="326" y="215" class="t-b" text-anchor="middle">11</text><text x="326" y="230" class="t-s" text-anchor="middle">admin</text>
<rect x="290" y="146" width="72" height="42" class="n"/><text x="326" y="165" class="t-b" text-anchor="middle">09</text><text x="326" y="180" class="t-s" text-anchor="middle">exposure</text>

<rect x="386" y="76" width="82" height="48" class="n-acc"/><text x="427" y="97" class="t-b t-acc" text-anchor="middle">04</text><text x="427" y="113" class="t-s" text-anchor="middle">sample</text>
<rect x="492" y="76" width="82" height="48" class="n-acc"/><text x="533" y="97" class="t-b t-acc" text-anchor="middle">05</text><text x="533" y="113" class="t-s" text-anchor="middle">weather</text>
