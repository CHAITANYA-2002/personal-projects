<line x1="82" y1="128" x2="98" y2="170" class="e" marker-end="url(#ar03)"/>
<line x1="176" y1="176" x2="192" y2="176" class="e" marker-end="url(#ar03)"/>
<line x1="270" y1="180" x2="286" y2="172" class="e" marker-end="url(#ar03)"/>
<line x1="270" y1="184" x2="286" y2="212" class="e" marker-end="url(#ar03)"/>
