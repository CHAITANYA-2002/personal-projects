<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 780 400" role="img" aria-label="Architecture: four external sources feed pipeline stages that write to a MySQL warehouse, whose views and marts are read by the Streamlit application.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<text x="82" y="20" class="t-b" text-anchor="middle">Sources</text>
<rect x="10" y="32" width="144" height="40" class="n"/><text x="82" y="50" class="t" text-anchor="middle">NASA GLC</text><text x="82" y="64" class="t-s" text-anchor="middle">landslide catalogue</text>
<rect x="10" y="82" width="144" height="40" class="n"/><text x="82" y="100" class="t" text-anchor="middle">Copernicus DEM</text><text x="82" y="114" class="t-s" text-anchor="middle">442 tiles, 17.5 GB</text>
<rect x="10" y="132" width="144" height="40" class="n"/><text x="82" y="150" class="t" text-anchor="middle">Open-Meteo</text><text x="82" y="164" class="t-s" text-anchor="middle">ERA5-Land + GloFAS</text>
<rect x="10" y="182" width="144" height="40" class="n"/><text x="82" y="200" class="t" text-anchor="middle">OSM + geoBoundaries</text><text x="82" y="214" class="t-s" text-anchor="middle">exposure, admin</text>

<text x="300" y="20" class="t-b" text-anchor="middle">Pipeline</text>
<rect x="196" y="32" width="208" height="252" class="n-ghost"/>
<rect x="210" y="44" width="180" height="26" class="n-sunk"/><text x="300" y="61" class="t-m" text-anchor="middle">00 · 01 · 02 · 03 build the grid</text>
<rect x="210" y="78" width="180" height="26" class="n-sunk"/><text x="300" y="95" class="t-m" text-anchor="middle">11 · 09 admin and exposure</text>
<rect x="210" y="112" width="180" height="26" class="n-acc"/><text x="300" y="129" class="t-m t-acc" text-anchor="middle">04 case-control sample</text>
<rect x="210" y="146" width="180" height="26" class="n-acc"/><text x="300" y="163" class="t-m t-acc" text-anchor="middle">05 weather backfill</text>
<rect x="210" y="180" width="180" height="26" class="n-sunk"/><text x="300" y="197" class="t-m" text-anchor="middle">06 features · 07 train</text>
<rect x="210" y="214" width="180" height="26" class="n-sunk"/><text x="300" y="231" class="t-m" text-anchor="middle">08 score forecast</text>
<rect x="210" y="248" width="180" height="26" class="n-wat"/><text x="300" y="265" class="t-m t-wat" text-anchor="middle">10 verify · 24 checks</text>

<line x1="158" y1="52" x2="206" y2="60" class="e" marker-end="url(#ar02)"/>
<line x1="158" y1="102" x2="206" y2="86" class="e" marker-end="url(#ar02)"/>
<line x1="158" y1="152" x2="206" y2="159" class="e" marker-end="url(#ar02)"/>
<line x1="158" y1="200" x2="206" y2="95" class="e-dash" marker-end="url(#ar02)"/>

<text x="510" y="20" class="t-b" text-anchor="middle">Warehouse</text>
<rect x="424" y="32" width="172" height="252" class="n-ghost"/>
<rect x="438" y="46" width="144" height="24" class="n"/><text x="510" y="62" class="t-m" text-anchor="middle">4 dimensions</text>
<rect x="438" y="78" width="144" height="24" class="n"/><text x="510" y="94" class="t-m" text-anchor="middle">5 fact tables</text>
<rect x="438" y="110" width="144" height="24" class="n"/><text x="510" y="126" class="t-m" text-anchor="middle">1 run log</text>
<rect x="438" y="150" width="144" height="24" class="n-wat"/><text x="510" y="166" class="t-m t-wat" text-anchor="middle">5 views</text>
<rect x="438" y="182" width="144" height="24" class="n-wat"/><text x="510" y="198" class="t-m t-wat" text-anchor="middle">3 marts</text>
<text x="510" y="232" class="t-s" text-anchor="middle">every window, ranking</text>
<text x="510" y="248" class="t-s" text-anchor="middle">and cohort is SQL —</text>
<text x="510" y="264" class="t-s" text-anchor="middle">not pandas</text>

<line x1="406" y1="158" x2="420" y2="158" class="e" marker-end="url(#ar02)"/>

<text x="700" y="20" class="t-b" text-anchor="middle">Read</text>
<rect x="620" y="46" width="150" height="118" class="n"/>
<text x="695" y="70" class="t-b" text-anchor="middle">Streamlit</text>
<text x="695" y="90" class="t-s" text-anchor="middle">risk map · districts</text>
<text x="695" y="106" class="t-s" text-anchor="middle">cell detail · model</text>
<text x="695" y="122" class="t-s" text-anchor="middle">field report · history</text>
<text x="695" y="146" class="t-m" text-anchor="middle">6 views</text>
<line x1="600" y1="130" x2="616" y2="105" class="e" marker-end="url(#ar02)"/>

<line x1="380" y1="300" x2="380" y2="330" class="e-dash"/>
<rect x="196" y="330" width="380" height="52" class="n-ghost"/>
<text x="386" y="352" class="t-s" text-anchor="middle">The application reads <tspan class="t-m">fact_risk_pred</tspan> through the marts.</text>
<text x="386" y="370" class="t-s" text-anchor="middle">Nothing downstream ever touches the model file directly.</text>
</svg>