<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 760 260" role="img" aria-label="Causal chain: stage 08 appends forecast days to dim_date, an unbounded read by the sampler admits them into the control pool, planned windows end in the present, and ERA5 answers with HTTP 400 which then kills the whole run.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<rect x="12" y="60" width="128" height="58" class="n"/>
<text x="76" y="82" class="t-s" text-anchor="middle">08_score.py appends</text>
<text x="76" y="98" class="t-s" text-anchor="middle">5 forecast days to</text>
<text x="76" y="112" class="t-m" text-anchor="middle">dim_date</text>
<text x="76" y="136" class="t-s" text-anchor="middle" style="opacity:.75">correct and necessary —</text>
<text x="76" y="150" class="t-s" text-anchor="middle" style="opacity:.75">the marts join through it</text>

<line x1="144" y1="89" x2="176" y2="89" class="e" marker-end="url(#ar15)"/>

<rect x="180" y="60" width="128" height="58" class="n-acc"/>
<text x="244" y="82" class="t-s t-acc" text-anchor="middle">04_build_sample.py</text>
<text x="244" y="98" class="t-s" text-anchor="middle">reads dim_date</text>
<text x="244" y="112" class="t-s t-acc" text-anchor="middle">with no bound</text>
<text x="244" y="140" class="t-s" text-anchor="middle" style="fill:var(--crit)">THE DEFECT</text>

<line x1="312" y1="89" x2="344" y2="89" class="e" marker-end="url(#ar15)"/>

<rect x="348" y="60" width="128" height="58" class="n"/>
<text x="412" y="82" class="t-s" text-anchor="middle">18 controls drawn</text>
<text x="412" y="98" class="t-s" text-anchor="middle">on 2026-08-27</text>
<text x="412" y="112" class="t-s" text-anchor="middle">to 2026-08-31</text>

<line x1="480" y1="89" x2="512" y2="89" class="e" marker-end="url(#ar15)"/>

<rect x="516" y="60" width="128" height="58" class="n"/>
<text x="580" y="82" class="t-s" text-anchor="middle">45-day windows</text>
<text x="580" y="98" class="t-s" text-anchor="middle">end in the present;</text>
<text x="580" y="112" class="t-s" text-anchor="middle">ERA5 lags ~5 days</text>

<line x1="648" y1="89" x2="680" y2="89" class="e" marker-end="url(#ar15)"/>
<rect x="684" y="60" width="66" height="58" class="n-acc" style="stroke:var(--crit)"/>
<text x="717" y="86" class="t-b" text-anchor="middle" style="fill:var(--crit)">HTTP</text>
<text x="717" y="104" class="t-b" text-anchor="middle" style="fill:var(--crit)">400</text>

<path d="M717 122 C 717 160 400 160 320 178" class="e" style="stroke:var(--crit)" marker-end="url(#ar15)"/>

<rect x="112" y="176" width="208" height="46" class="n" style="stroke:var(--crit)"/>
<text x="216" y="196" class="t-s" text-anchor="middle" style="fill:var(--crit)">retried 4× with backoff,</text>
<text x="216" y="212" class="t-s" text-anchor="middle" style="fill:var(--crit)">then raised — killing a run with</text>
<text x="216" y="226" class="t-s" text-anchor="middle" style="fill:var(--crit)">10,000 good windows left</text>

<rect x="352" y="168" width="398" height="62" class="n-acc"/>
<text x="366" y="188" class="t-b t-acc">Two fixes, because there were two bugs</text>
<text x="366" y="206" class="t-s">1 · Sampler and loader now bound their <tspan class="t-m">dim_date</tspan> reads to the study window.</text>
<text x="366" y="222" class="t-s">2 · Any non-429 4xx raises immediately, skips its batch, and the run continues.</text>
</svg>