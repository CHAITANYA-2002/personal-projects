<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 700 250" role="img" aria-label="Space-time exclusion buffer around each event: candidates inside 15 kilometres and two days are discarded rather than labelled negative; spatial controls are drawn from an annulus starting at 25 kilometres.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<line x1="60" y1="200" x2="640" y2="200" class="e" marker-end="url(#ar08)"/>
<text x="640" y="222" class="t-s" text-anchor="end">distance from event →</text>
<line x1="60" y1="200" x2="60" y2="30" class="e" marker-end="url(#ar08)"/>
<text x="70" y="40" class="t-s">days</text>

<circle cx="60" cy="200" r="5" class="ar-acc" style="fill:var(--accent)"/>
<text x="72" y="196" class="t-m t-acc">event</text>

<rect x="60" y="140" width="120" height="60" style="fill:var(--crit);opacity:.13"/>
<rect x="60" y="140" width="120" height="60" style="fill:none;stroke:var(--crit);stroke-width:1.5;stroke-dasharray:4 3"/>
<text x="120" y="166" class="t-s" text-anchor="middle" style="fill:var(--crit);font-weight:600">DISCARD</text>
<text x="120" y="182" class="t-s" text-anchor="middle" style="fill:var(--crit)">15 km · ±2 d</text>
<text x="120" y="215" class="t-m" text-anchor="middle">15 km</text>

<rect x="248" y="60" width="292" height="140" class="n-wat" style="opacity:.5"/>
<text x="394" y="100" class="t-b t-wat" text-anchor="middle">spatial control annulus</text>
<text x="394" y="120" class="t-m t-wat" text-anchor="middle">25 km – 300 km</text>
<text x="248" y="215" class="t-m" text-anchor="middle">25 km</text>
<text x="540" y="215" class="t-m" text-anchor="middle">300 km</text>

<rect x="184" y="140" width="60" height="60" style="fill:none;stroke:currentColor;stroke-width:1;stroke-dasharray:2 3;opacity:.5"/>
<text x="214" y="128" class="t-s" text-anchor="middle" style="opacity:.7">gap</text>

<text x="394" y="152" class="t-s" text-anchor="middle">inner edge clears the exclusion buffer</text>
<text x="394" y="170" class="t-s" text-anchor="middle">outer edge keeps the control inside the</text>
<text x="394" y="186" class="t-s" text-anchor="middle">same weather system</text>

<text x="60" y="24" class="t-s">±2</text>
</svg>