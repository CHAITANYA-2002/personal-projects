<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 720 250" role="img" aria-label="Cell identifier encoding: latitude and longitude are floored into indices, packed as lat_idx times 1000 plus lon_idx, and recovered by divmod.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<rect x="10" y="52" width="130" height="56" class="n"/>
<text x="75" y="74" class="t" text-anchor="middle">latitude 30.28</text>
<text x="75" y="94" class="t-m" text-anchor="middle">floor((30.28−21.5)/0.1)</text>
<rect x="10" y="132" width="130" height="56" class="n"/>
<text x="75" y="154" class="t" text-anchor="middle">longitude 78.61</text>
<text x="75" y="174" class="t-m" text-anchor="middle">floor((78.61−72.0)/0.1)</text>

<line x1="144" y1="80" x2="182" y2="104" class="e" marker-end="url(#ar04)"/>
<line x1="144" y1="160" x2="182" y2="136" class="e" marker-end="url(#ar04)"/>

<rect x="188" y="96" width="118" height="48" class="n-sunk"/>
<text x="247" y="116" class="t-m" text-anchor="middle">lat_idx = 87</text>
<text x="247" y="134" class="t-m" text-anchor="middle">lon_idx = 66</text>

<line x1="310" y1="120" x2="352" y2="120" class="e-acc" marker-end="url(#ar04)"/>
<text x="331" y="110" class="t-m t-acc" text-anchor="middle">×1000 +</text>

<rect x="358" y="92" width="150" height="56" class="n-acc"/>
<text x="433" y="116" class="t-b" text-anchor="middle" style="font-size:16px">cell_id</text>
<text x="433" y="136" class="t-m t-acc" text-anchor="middle">87066</text>

<line x1="512" y1="120" x2="552" y2="120" class="e" marker-end="url(#ar04)"/>
<text x="532" y="110" class="t-m" text-anchor="middle">divmod</text>

<rect x="558" y="92" width="150" height="56" class="n"/>
<text x="633" y="114" class="t-s" text-anchor="middle">centroid, 3 dp</text>
<text x="633" y="134" class="t-m" text-anchor="middle">30.250 N · 78.650 E</text>

<rect x="188" y="182" width="520" height="52" class="n-ghost"/>
<text x="200" y="202" class="t-s">Guard, checked at import time:</text>
<text x="200" y="220" class="t-m">if N_LON_CELLS &gt;= LON_INDEX_SPAN: raise ValueError — 255 used of 1000, 745 spare</text>
</svg>