<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 760 340" role="img" aria-label="Star schema: dim_cell and dim_date are the conformed dimensions joined by every fact table on cell_id and date_id.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<rect x="286" y="30" width="180" height="52" class="n-acc"/>
<text x="376" y="50" class="t-b t-acc" text-anchor="middle">dim_cell</text>
<text x="376" y="66" class="t-m" text-anchor="middle">40,800 · 25 cols</text>
<text x="376" y="78" class="t-s" text-anchor="middle">cell_id = lat_idx × 1000 + lon_idx</text>

<rect x="286" y="258" width="180" height="52" class="n-acc"/>
<text x="376" y="278" class="t-b t-acc" text-anchor="middle">dim_date</text>
<text x="376" y="294" class="t-m" text-anchor="middle">3,658 · 11 cols</text>
<text x="376" y="306" class="t-s" text-anchor="middle">date_id = YYYYMMDD</text>

<rect x="30" y="100" width="160" height="46" class="n"/>
<text x="110" y="119" class="t" text-anchor="middle">fact_landslide</text>
<text x="110" y="135" class="t-m" text-anchor="middle">1,719 · FK both</text>

<rect x="30" y="164" width="160" height="46" class="n"/>
<text x="110" y="183" class="t" text-anchor="middle">fact_weather_daily</text>
<text x="110" y="199" class="t-m" text-anchor="middle">no FK · bulk loaded</text>

<rect x="30" y="228" width="160" height="46" class="n"/>
<text x="110" y="247" class="t" text-anchor="middle">fact_sample</text>
<text x="110" y="263" class="t-m" text-anchor="middle">11,955 · label + stratum</text>

<rect x="562" y="100" width="168" height="46" class="n"/>
<text x="646" y="119" class="t" text-anchor="middle">fact_exposure</text>
<text x="646" y="135" class="t-m" text-anchor="middle">7,627 · FK cell</text>

<rect x="562" y="164" width="168" height="46" class="n"/>
<text x="646" y="183" class="t" text-anchor="middle">fact_risk_pred</text>
<text x="646" y="199" class="t-m" text-anchor="middle">PK incl. model_version</text>

<rect x="562" y="228" width="168" height="46" class="n-sunk"/>
<text x="646" y="247" class="t" text-anchor="middle">dim_road · dim_settlement</text>
<text x="646" y="263" class="t-s" text-anchor="middle">traceability for exposure</text>

<line x1="194" y1="118" x2="282" y2="66" class="e" marker-end="url(#ar14)"/>
<line x1="194" y1="130" x2="282" y2="272" class="e" marker-end="url(#ar14)"/>
<line x1="194" y1="180" x2="282" y2="72" class="e-dash" marker-end="url(#ar14)"/>
<line x1="194" y1="192" x2="282" y2="270" class="e-dash" marker-end="url(#ar14)"/>
<line x1="194" y1="240" x2="282" y2="76" class="e-dash" marker-end="url(#ar14)"/>
<line x1="194" y1="252" x2="282" y2="268" class="e-dash" marker-end="url(#ar14)"/>
<line x1="558" y1="118" x2="470" y2="68" class="e" marker-end="url(#ar14)"/>
<line x1="558" y1="180" x2="470" y2="74" class="e-dash" marker-end="url(#ar14)"/>
<line x1="558" y1="192" x2="470" y2="270" class="e-dash" marker-end="url(#ar14)"/>
<line x1="558" y1="248" x2="470" y2="80" class="e-dash" marker-end="url(#ar14)"/>

<text x="376" y="150" class="t-s" text-anchor="middle">solid = enforced foreign key (3)</text>
<text x="376" y="166" class="t-s" text-anchor="middle">dashed = join by convention</text>
<text x="376" y="196" class="t-s" text-anchor="middle" style="font-style:italic">No geometry columns anywhere.</text>
<text x="376" y="212" class="t-s" text-anchor="middle">Distance work is precomputed in GeoPandas</text>
<text x="376" y="228" class="t-s" text-anchor="middle">and landed in fact_exposure — avoiding the</text>
<text x="376" y="244" class="t-s" text-anchor="middle">SRID 4326 axis-order trap.</text>
</svg>