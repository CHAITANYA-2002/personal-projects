<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 740 240" role="img" aria-label="Catalogue funnel: 11,033 raw rows reduce to 2,037 inside the bounding box, 1,781 inside the date window, and 1,719 after the country filter.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<rect x="20" y="40" width="130" height="66" class="n"/>
<text x="85" y="66" class="t-b" text-anchor="middle" style="font-size:16px">11,033</text>
<text x="85" y="84" class="t-s" text-anchor="middle">raw CSV rows</text>
<text x="85" y="99" class="t-s" text-anchor="middle">14 of 31 columns read</text>

<line x1="154" y1="73" x2="190" y2="73" class="e" marker-end="url(#ar06)"/>
<text x="172" y="62" class="t-m" text-anchor="middle">bbox</text>
<text x="172" y="128" class="t-s" text-anchor="middle" style="fill:var(--crit)">−8,996</text>

<rect x="194" y="40" width="130" height="66" class="n"/>
<text x="259" y="66" class="t-b" text-anchor="middle" style="font-size:16px">2,037</text>
<text x="259" y="84" class="t-s" text-anchor="middle">inside 21.5–37.5 N</text>
<text x="259" y="99" class="t-s" text-anchor="middle">72.0–97.5 E</text>

<line x1="328" y1="73" x2="364" y2="73" class="e" marker-end="url(#ar06)"/>
<text x="346" y="62" class="t-m" text-anchor="middle">dates</text>
<text x="346" y="128" class="t-s" text-anchor="middle" style="fill:var(--crit)">−256</text>

<rect x="368" y="40" width="130" height="66" class="n"/>
<text x="433" y="66" class="t-b" text-anchor="middle" style="font-size:16px">1,781</text>
<text x="433" y="84" class="t-s" text-anchor="middle">2007-01-01 to</text>
<text x="433" y="99" class="t-s" text-anchor="middle">2016-12-31</text>

<line x1="502" y1="73" x2="538" y2="73" class="e" marker-end="url(#ar06)"/>
<text x="520" y="62" class="t-m" text-anchor="middle">country</text>
<text x="520" y="128" class="t-s" text-anchor="middle" style="fill:var(--crit)">−62</text>

<rect x="542" y="40" width="150" height="66" class="n-acc"/>
<text x="617" y="66" class="t-b t-acc" text-anchor="middle" style="font-size:16px">1,719</text>
<text x="617" y="84" class="t-s" text-anchor="middle">7 arc countries</text>
<text x="617" y="99" class="t-s" text-anchor="middle">fact_landslide</text>

<rect x="20" y="152" width="672" height="72" class="n-ghost"/>
<text x="34" y="172" class="t-b">Composition of the 1,719</text>
<text x="34" y="194" class="t-m">India 1,017 · Nepal 481 · Pakistan 118 · Bangladesh 42 · Myanmar 23 · Bhutan 20 · China 18</text>
<text x="34" y="214" class="t-s">973 distinct cells · 89.4% rainfall-triggered · median location error 10 km · actual range 2007-01-05 to 2016-10-15</text>
</svg>