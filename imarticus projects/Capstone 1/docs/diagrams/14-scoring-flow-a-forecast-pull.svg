<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 780 330" role="img" aria-label="Scoring flow: a forecast pull with sixty past days and sixteen forecast days feeds the same feature module, then the model score splits into a prior-corrected absolute probability, a relative-risk band, and an exposure-weighted priority.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<rect x="16" y="30" width="164" height="64" class="n"/>
<text x="98" y="52" class="t" text-anchor="middle">forecast pull</text>
<text x="98" y="70" class="t-m" text-anchor="middle">past_days = 60</text>
<text x="98" y="86" class="t-m" text-anchor="middle">forecast_days = 16</text>
<text x="98" y="114" class="t-s" text-anchor="middle">the model's features are</text>
<text x="98" y="128" class="t-s" text-anchor="middle">antecedent, so a forecast</text>
<text x="98" y="142" class="t-s" text-anchor="middle">alone is useless</text>

<line x1="184" y1="62" x2="216" y2="62" class="e" marker-end="url(#ar13)"/>
<rect x="220" y="38" width="150" height="48" class="n-wat"/>
<text x="295" y="58" class="t t-wat" text-anchor="middle">same feature module</text>
<text x="295" y="74" class="t-s" text-anchor="middle">no training/serving skew</text>

<line x1="374" y1="62" x2="406" y2="62" class="e" marker-end="url(#ar13)"/>
<rect x="410" y="38" width="120" height="48" class="n-acc"/>
<text x="470" y="58" class="t-b t-acc" text-anchor="middle">model score</text>
<text x="470" y="74" class="t-s" text-anchor="middle">e.g. 0.23</text>

<path d="M470 90 C 470 110 300 108 268 128" class="e" marker-end="url(#ar13)"/>
<path d="M470 90 L 470 128" class="e" marker-end="url(#ar13)"/>
<path d="M470 90 C 470 110 640 108 672 128" class="e" marker-end="url(#ar13)"/>

<rect x="150" y="132" width="234" height="106" class="n"/>
<text x="267" y="152" class="t-b" text-anchor="middle">absolute_probability</text>
<text x="267" y="170" class="t-s" text-anchor="middle">the real-world frequency</text>
<line x1="164" y1="178" x2="370" y2="178" class="e-dash"/>
<text x="267" y="198" class="t-m" text-anchor="middle">offset = log(odds_sample / odds_pop)</text>
<text x="267" y="216" class="t-m" text-anchor="middle">logit(p) − offset</text>
<text x="267" y="232" class="t-s" text-anchor="middle" style="fill:var(--crit)">without it every number is inflated ~10,000×</text>

<rect x="398" y="132" width="146" height="106" class="n-acc"/>
<text x="471" y="152" class="t-b t-acc" text-anchor="middle">risk_band</text>
<text x="471" y="170" class="t-s" text-anchor="middle">cut on relative risk</text>
<line x1="412" y1="178" x2="530" y2="178" class="e-dash"/>
<text x="412" y="196" class="t-m" style="fill:var(--crit)">≥5×  critical</text>
<text x="412" y="211" class="t-m" style="fill:var(--high)">≥3×  high</text>
<text x="412" y="226" class="t-m" style="fill:var(--elev)">≥2×  elevated</text>
<text x="524" y="196" class="t-m" style="fill:var(--mod)">≥1.2×</text>
<text x="524" y="211" class="t-m" style="fill:var(--low)">else</text>

<rect x="558" y="132" width="206" height="106" class="n"/>
<text x="661" y="152" class="t-b" text-anchor="middle">priority_score</text>
<text x="661" y="170" class="t-s" text-anchor="middle">risk × exposure</text>
<line x1="572" y1="178" x2="750" y2="178" class="e-dash"/>
<text x="572" y="198" class="t-m">population .40</text>
<text x="572" y="213" class="t-m">settlements .20 · roads .20</text>
<text x="572" y="228" class="t-m">health .10 · schools .10</text>

<rect x="150" y="256" width="614" height="60" class="n-ghost"/>
<text x="166" y="276" class="t-b" style="fill:var(--crit)">Why bands are cut on relative risk, not the raw score</text>
<text x="166" y="296" class="t-s">A model calibrated against a 16% base rate produces scores centred near 0.16, so a "critical at 0.80" rule would never fire and the</text>
<text x="166" y="310" class="t-s">whole map would read "low" straight through a monsoon. 5× also carries the meaning an officer needs: five times the background rate.</text>
</svg>