<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 760 364" role="img" aria-label="Before and after elevation band matching: uniform sampling from the hill mask drew controls from the Tibetan plateau at 4,479 metres against 1,433 for cases; band matching draws controls from the case's own 500 metre band, closing the gap to 17 metres.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<text x="16" y="20" class="t-b" style="fill:var(--crit)">BEFORE — uniform draw over the hill mask</text>
<line x1="16" y1="150" x2="360" y2="150" class="e"/>
<text x="16" y="166" class="t-s">0 m</text>
<text x="352" y="166" class="t-s" text-anchor="end">6,000 m</text>

<rect x="90" y="118" width="26" height="32" style="fill:var(--accent);opacity:.85"/>
<text x="103" y="110" class="t-m t-acc" text-anchor="middle">1,433</text>
<text x="103" y="96" class="t-s t-acc" text-anchor="middle">cases</text>

<rect x="272" y="118" width="26" height="32" style="fill:var(--crit);opacity:.7"/>
<text x="285" y="110" class="t-m" text-anchor="middle" style="fill:var(--crit)">4,479</text>
<text x="285" y="96" class="t-s" text-anchor="middle" style="fill:var(--crit)">controls</text>

<line x1="116" y1="134" x2="268" y2="134" class="e-dash" style="stroke:var(--crit)"/>
<text x="192" y="128" class="t-m" text-anchor="middle" style="fill:var(--crit)">gap +3,046 m</text>

<rect x="16" y="182" width="344" height="76" class="n-ghost" style="stroke:var(--crit)"/>
<text x="30" y="202" class="t-s">Top SHAP feature:</text>
<text x="30" y="222" class="t-m" style="fill:var(--crit)">elev_mean · 0.513</text>
<text x="30" y="240" class="t-s">runner-up rain_max_1d_in_7 · 0.221 — half as much</text>

<line x1="380" y1="30" x2="380" y2="330" class="e-dash"/>

<text x="404" y="20" class="t-b t-acc">AFTER — elevation-band matching</text>
<line x1="404" y1="150" x2="748" y2="150" class="e"/>
<text x="404" y="166" class="t-s">0 m</text>
<text x="740" y="166" class="t-s" text-anchor="end">6,000 m</text>

<rect x="466" y="130" width="60" height="20" style="fill:var(--accent-2);opacity:.3"/>
<text x="496" y="180" class="t-s" text-anchor="middle" style="opacity:.8">±1 band</text>
<text x="496" y="194" class="t-s" text-anchor="middle" style="opacity:.8">1,500 m window</text>

<rect x="484" y="118" width="26" height="32" style="fill:var(--accent);opacity:.85"/>
<text x="497" y="110" class="t-m t-acc" text-anchor="middle">1,433</text>
<text x="497" y="96" class="t-s t-acc" text-anchor="middle">cases</text>
<rect x="480" y="118" width="8" height="32" style="fill:var(--water);opacity:.85"/>
<text x="466" y="110" class="t-m t-wat" text-anchor="middle">1,416</text>
<text x="466" y="96" class="t-s t-wat" text-anchor="middle">controls</text>
<text x="600" y="132" class="t-m t-acc">gap −17 m</text>

<rect x="404" y="182" width="344" height="76" class="n-ghost" style="stroke:var(--accent)"/>
<text x="418" y="202" class="t-s">Top SHAP feature:</text>
<text x="418" y="222" class="t-m t-acc">api (antecedent precipitation) · 0.660</text>
<text x="418" y="240" class="t-s">elev_mean no longer appears in the top 15 at all</text>
<text x="404" y="272" class="t-s" style="opacity:.8">Both columns are the same model class on the same run —</text>
<text x="404" y="286" class="t-s" style="opacity:.8">only the sampler changed between them.</text>

<rect x="16" y="292" width="732" height="56" class="n-acc"/>
<text x="32" y="312" class="t-b t-acc">The mechanism</text>
<text x="32" y="332" class="t-s">Bands are 500 m wide with ±1 band tolerance. Background draws anchor on a case cell <tspan class="t-b">first</tspan>, then pick a cell in that anchor's band;</text>
<text x="32" y="346" class="t-s">spatial draws intersect the 25–300 km annulus with the band, falling back to the plain annulus rather than dropping the case.</text>
</svg>