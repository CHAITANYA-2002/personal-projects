<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 760 336" role="img" aria-label="Training flow: three estimators are fitted on the training split, calibrated on validation, scored on all three splits, compared by PR-AUC, then explained with SHAP and cross-validated across regions.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<rect x="16" y="120" width="130" height="56" class="n"/>
<text x="81" y="142" class="t" text-anchor="middle">TRAIN split</text>
<text x="81" y="160" class="t-m" text-anchor="middle">2,108 rows · 465 pos</text>
<line x1="150" y1="148" x2="180" y2="148" class="e" marker-end="url(#ar12)"/>

<rect x="184" y="80" width="146" height="36" class="n"/><text x="257" y="103" class="t" text-anchor="middle">logistic · L2, C=0.5</text>
<rect x="184" y="126" width="146" height="36" class="n"/><text x="257" y="149" class="t" text-anchor="middle">random forest · 500</text>
<rect x="184" y="172" width="146" height="36" class="n"/><text x="257" y="195" class="t" text-anchor="middle">XGBoost · 250–600</text>
<text x="257" y="228" class="t-s" text-anchor="middle">tree depth and leaf size scale with</text>
<text x="257" y="242" class="t-s" text-anchor="middle">the positive count — under 500</text>
<text x="257" y="256" class="t-s" text-anchor="middle">positives, capacity is tightened</text>

<line x1="334" y1="120" x2="366" y2="140" class="e" marker-end="url(#ar12)"/>
<line x1="334" y1="144" x2="366" y2="148" class="e" marker-end="url(#ar12)"/>
<line x1="334" y1="188" x2="366" y2="158" class="e" marker-end="url(#ar12)"/>

<rect x="370" y="124" width="132" height="48" class="n-wat"/>
<text x="436" y="144" class="t t-wat" text-anchor="middle">calibrate</text>
<text x="436" y="160" class="t-s" text-anchor="middle">on VAL split only</text>
<text x="436" y="192" class="t-s" text-anchor="middle">Platt below 50 positives,</text>
<text x="436" y="206" class="t-s" text-anchor="middle">isotonic above</text>

<line x1="506" y1="148" x2="536" y2="148" class="e" marker-end="url(#ar12)"/>

<rect x="540" y="112" width="150" height="72" class="n-acc"/>
<text x="615" y="134" class="t-b t-acc" text-anchor="middle">select by PR-AUC</text>
<text x="615" y="154" class="t-s" text-anchor="middle">on the TEST split</text>
<text x="615" y="172" class="t-m t-acc" text-anchor="middle">→ logistic</text>

<line x1="615" y1="108" x2="615" y2="80" class="e" marker-end="url(#ar12)"/>
<rect x="528" y="34" width="174" height="44" class="n"/>
<text x="615" y="52" class="t" text-anchor="middle">SHAP attribution</text>
<text x="615" y="68" class="t-s" text-anchor="middle">Linear or Tree explainer</text>

<line x1="615" y1="188" x2="615" y2="216" class="e" marker-end="url(#ar12)"/>
<rect x="528" y="220" width="174" height="44" class="n"/>
<text x="615" y="238" class="t" text-anchor="middle">leave-one-region-out</text>
<text x="615" y="254" class="t-s" text-anchor="middle">4 blocks, refit each time</text>

<rect x="16" y="278" width="686" height="50" class="n-ghost"/>
<text x="30" y="298" class="t-s">The SHAP path must peel <tspan class="t-m">CalibratedClassifierCV</tspan> → <tspan class="t-m">FrozenEstimator</tspan> → <tspan class="t-m">Pipeline</tspan> to reach the raw model.</text>
<text x="30" y="316" class="t-s">A linear model also needs its inputs imputed and scaled first — raw NaNs produce silent nonsense.</text>
</svg>