<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 740 250" role="img" aria-label="Before: merged windows per cell shift their boundaries when a sample is added, invalidating the cache. After: one window anchored to each sample date never moves.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<text x="16" y="20" class="t-b" style="fill:var(--crit)">BEFORE — windows merged per cell</text>
<text x="16" y="44" class="t-s">samples for cell 87066:</text>
<circle cx="150" cy="40" r="4" style="fill:var(--accent)"/>
<circle cx="230" cy="40" r="4" style="fill:var(--accent)"/>
<rect x="110" y="54" width="164" height="20" class="n-sunk"/>
<text x="192" y="68" class="t-m" text-anchor="middle">merged window A</text>

<text x="16" y="100" class="t-s">add one sample →</text>
<circle cx="150" cy="96" r="4" style="fill:var(--accent)"/>
<circle cx="230" cy="96" r="4" style="fill:var(--accent)"/>
<circle cx="310" cy="96" r="4" style="fill:var(--crit)"/>
<rect x="110" y="110" width="244" height="20" style="fill:none;stroke:var(--crit);stroke-width:1.5;stroke-dasharray:4 3"/>
<text x="232" y="124" class="t-m" text-anchor="middle" style="fill:var(--crit)">boundaries move — cache key changes</text>
<text x="16" y="156" class="t-m" style="fill:var(--crit)">2,190 windows fetched → 232 survived</text>

<line x1="380" y1="16" x2="380" y2="230" class="e-dash"/>

<text x="404" y="20" class="t-b t-acc">AFTER — one window per sample</text>
<text x="404" y="44" class="t-s">samples for cell 87066:</text>
<circle cx="530" cy="40" r="4" style="fill:var(--accent)"/>
<circle cx="620" cy="40" r="4" style="fill:var(--accent)"/>
<rect x="486" y="54" width="88" height="20" class="n-acc"/>
<rect x="576" y="54" width="88" height="20" class="n-acc"/>
<text x="530" y="68" class="t-m" text-anchor="middle">45 d</text>
<text x="620" y="68" class="t-m" text-anchor="middle">45 d</text>

<text x="404" y="100" class="t-s">add one sample →</text>
<circle cx="530" cy="96" r="4" style="fill:var(--accent)"/>
<circle cx="620" cy="96" r="4" style="fill:var(--accent)"/>
<circle cx="700" cy="96" r="4" style="fill:var(--water)"/>
<rect x="486" y="110" width="88" height="20" class="n-acc"/>
<rect x="576" y="110" width="88" height="20" class="n-acc"/>
<rect x="656" y="110" width="80" height="20" class="n-wat"/>
<text x="530" y="124" class="t-m" text-anchor="middle">unchanged</text>
<text x="620" y="124" class="t-m" text-anchor="middle">unchanged</text>
<text x="404" y="156" class="t-m t-acc">only the new sample is fetched</text>

<rect x="404" y="176" width="332" height="56" class="n-ghost"/>
<text x="416" y="196" class="t-s">Belt and braces: <tspan class="t-m">pending()</tspan> now checks <tspan class="t-b">day coverage</tspan></text>
<text x="416" y="212" class="t-s">across every cache file rather than filename existence,</text>
<text x="416" y="228" class="t-s">so days already on disk are never refetched.</text>
</svg>