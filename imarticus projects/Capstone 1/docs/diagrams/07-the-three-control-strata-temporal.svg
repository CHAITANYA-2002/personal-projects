<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 760 300" role="img" aria-label="The three control strata: temporal holds the cell constant and varies the date, spatial holds the date and varies the cell within an elevation-matched annulus, background samples freely from the case elevation distribution.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<defs><marker id="ar07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ar"/></marker></defs>

<rect x="300" y="12" width="150" height="46" class="n-acc"/>
<text x="375" y="32" class="t-b t-acc" text-anchor="middle">1,655 cases</text>
<text x="375" y="48" class="t-s" text-anchor="middle">label = 1</text>

<path d="M330 62 C 300 76 200 78 152 92" class="e" marker-end="url(#ar07)"/>
<path d="M375 62 L 375 92" class="e" marker-end="url(#ar07)"/>
<path d="M420 62 C 450 76 550 78 598 92" class="e" marker-end="url(#ar07)"/>

<rect x="20" y="96" width="230" height="132" class="n"/>
<text x="135" y="118" class="t-b" text-anchor="middle">Temporal · 50%</text>
<text x="135" y="136" class="t-m" text-anchor="middle">3.0 per case → 5,157 rows</text>
<line x1="36" y1="146" x2="234" y2="146" class="e-dash"/>
<text x="135" y="166" class="t-s" text-anchor="middle"><tspan class="t-acc">same</tspan> cell · <tspan class="t-acc">different</tspan> date</text>
<text x="135" y="184" class="t-s" text-anchor="middle">within ±30 days of the event's</text>
<text x="135" y="199" class="t-s" text-anchor="middle">day-of-year, compared circularly</text>
<text x="135" y="219" class="t-s" text-anchor="middle" style="font-style:italic">"why did THIS monsoon day fail</text>
<text x="135" y="234" class="t-s" text-anchor="middle" style="font-style:italic">when hundreds of others did not?"</text>

<rect x="262" y="96" width="226" height="132" class="n"/>
<text x="375" y="118" class="t-b" text-anchor="middle">Spatial · 30%</text>
<text x="375" y="136" class="t-m" text-anchor="middle">1.8 per case → 3,098 rows</text>
<line x1="278" y1="146" x2="472" y2="146" class="e-dash"/>
<text x="375" y="166" class="t-s" text-anchor="middle"><tspan class="t-acc">same</tspan> date · <tspan class="t-acc">different</tspan> cell</text>
<text x="375" y="184" class="t-s" text-anchor="middle">25–300 km annulus, intersected</text>
<text x="375" y="199" class="t-s" text-anchor="middle">with the case's elevation band</text>
<text x="375" y="219" class="t-s" text-anchor="middle" style="font-style:italic">"the storm hit both — why did</text>
<text x="375" y="234" class="t-s" text-anchor="middle" style="font-style:italic">only one slope go?"</text>

<rect x="500" y="96" width="240" height="132" class="n"/>
<text x="620" y="118" class="t-b" text-anchor="middle">Background · 20%</text>
<text x="620" y="136" class="t-m" text-anchor="middle">1.2 per case → 2,063 rows</text>
<line x1="516" y1="146" x2="724" y2="146" class="e-dash"/>
<text x="620" y="166" class="t-s" text-anchor="middle">random cell and date, drawn</text>
<text x="620" y="184" class="t-s" text-anchor="middle">from the <tspan class="t-acc">case elevation distribution</tspan></text>
<text x="620" y="199" class="t-s" text-anchor="middle">by anchoring on a case first</text>
<text x="620" y="219" class="t-s" text-anchor="middle" style="font-style:italic">"what does an ordinary day on</text>
<text x="620" y="234" class="t-s" text-anchor="middle" style="font-style:italic">this kind of slope look like?"</text>

<rect x="20" y="248" width="720" height="42" class="n-ghost"/>
<text x="34" y="268" class="t-s"><tspan class="t-b">Admission gate, applied to every candidate:</tspan> reject if the pair is already taken, or if it lies within</text>
<text x="34" y="284" class="t-s">15 km and ±2 days of any recorded event. 46,234 cell-date pairs sit inside that exclusion buffer.</text>
</svg>