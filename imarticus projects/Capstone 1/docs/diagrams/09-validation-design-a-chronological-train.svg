<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="dgm" viewBox="0 0 720 262" role="img" aria-label="Validation design: a chronological train, validation and test split, with leave-one-region-out cross-validation layered on top across four region blocks.">
<style>
  svg { color: #151F1C; background: #F8F9F8;
        --surface:#FFFFFF; --sunk:#E9EDEA; --ink-2:#4C5955;
        --accent:#9A5615; --accent-wash:#F3E6D8; --water:#20666E;
        --water-wash:#DDEAEB; --crit:#8F2222; --high:#A2510A;
        --elev:#8A6208; --mod:#456F13; --low:#5A6B72; }
  @media (prefers-color-scheme: dark) {
    svg { color: #E3E9E5; background: #101714;
          --surface:#182220; --sunk:#202C28; --ink-2:#9DABA5;
          --accent:#DA9451; --accent-wash:#31241A; --water:#66B4BC;
          --water-wash:#16292C; --crit:#E07A7A; --high:#DFA05A;
          --elev:#CFB055; --mod:#9BC46A; --low:#93A5AC; }
  }
  .n      { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }
  .n-sunk { fill: var(--sunk);    stroke: currentColor; stroke-width: 1.4; }
  .n-acc  { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.8; }
  .n-wat  { fill: var(--water-wash);  stroke: var(--water);  stroke-width: 1.4; }
  .n-ghost{ fill: none; stroke: currentColor; stroke-width: 1;
            stroke-dasharray: 3 3; opacity: .55; }
  .e      { stroke: currentColor; stroke-width: 1.3; fill: none; }
  .e-acc  { stroke: var(--accent); stroke-width: 2; fill: none; }
  .e-dash { stroke: currentColor; stroke-width: 1.2; fill: none;
            stroke-dasharray: 4 3; opacity: .7; }
  .t      { font: 500 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-b    { font: 700 12.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: currentColor; }
  .t-s    { font: 400 10.5px system-ui, -apple-system, "Segoe UI", sans-serif;
            fill: var(--ink-2); }
  .t-m    { font: 400 10.5px ui-monospace, "Cascadia Mono", Consolas, monospace;
            fill: var(--ink-2); }
  .t-acc  { fill: var(--accent); font-weight: 600; }
  .t-wat  { fill: var(--water); }
  .ar     { fill: currentColor; }
  .ar-acc { fill: var(--accent); }
</style>
<text x="10" y="26" class="t-b">Temporal blocking — assigned from date_id alone</text>
<rect x="10" y="36" width="420" height="42" class="n-sunk"/>
<text x="220" y="56" class="t-b" text-anchor="middle">TRAIN</text>
<text x="220" y="71" class="t-m" text-anchor="middle">2007-01-01 → 2013-12-31</text>
<rect x="434" y="36" width="90" height="42" class="n"/>
<text x="479" y="56" class="t-b" text-anchor="middle">VAL</text>
<text x="479" y="71" class="t-m" text-anchor="middle">2014</text>
<rect x="528" y="36" width="182" height="42" class="n-acc"/>
<text x="619" y="56" class="t-b t-acc" text-anchor="middle">TEST</text>
<text x="619" y="71" class="t-m" text-anchor="middle">2015 → 2016</text>
<text x="479" y="98" class="t-s" text-anchor="middle">calibration is fitted here, and only here</text>

<line x1="10" y1="118" x2="710" y2="118" class="e-dash"/>

<text x="10" y="144" class="t-b">Spatial blocking — leave one region out, layered on top</text>
<rect x="10" y="156" width="168" height="56" class="n"/>
<text x="94" y="178" class="t" text-anchor="middle">west_himalaya</text>
<text x="94" y="196" class="t-s" text-anchor="middle">Kashmir · Himachal</text>
<rect x="186" y="156" width="168" height="56" class="n"/>
<text x="270" y="178" class="t" text-anchor="middle">central_himalaya</text>
<text x="270" y="196" class="t-s" text-anchor="middle">Uttarakhand · UP</text>
<rect x="362" y="156" width="168" height="56" class="n"/>
<text x="446" y="178" class="t" text-anchor="middle">eastern_himalaya</text>
<text x="446" y="196" class="t-s" text-anchor="middle">Sikkim · Bengal · Arunachal</text>
<rect x="538" y="156" width="172" height="56" class="n"/>
<text x="624" y="178" class="t" text-anchor="middle">north_east</text>
<text x="624" y="196" class="t-s" text-anchor="middle">Assam · Nagaland · +4</text>

<text x="10" y="234" class="t-s">Kashmir is grouped with Himachal rather than pooled east: only <tspan class="t-acc">47%</tspan> of its events fall in the monsoon against 85–93% elsewhere,</text>
<text x="10" y="248" class="t-s">because it is driven by western disturbances and snowmelt. A model that generalises there has learned conditions, not a calendar.</text>
</svg>